name: Concept test

# Run by hand: makes one format-test clip from concepts.yaml.
on:
  workflow_dispatch:
    inputs:
      concept:
        description: "Concept id from concepts.yaml"
        required: true
        default: "concept-dabke"
      slot:
        description: "When it posts if approved (Beirut time), e.g. Saturday 18:00"
        required: false
        default: "Saturday 18:00"

permissions:
  contents: write

concurrency:
  group: rappit-state
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
      OUT_DIR: ${{ github.workspace }}/out
      CONCEPT: ${{ inputs.concept }}
      SLOT: ${{ inputs.slot }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: (which ffmpeg && fc-list | grep -q DejaVuSans-Bold) || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core)
      - run: pip install -r requirements.txt
      - name: Run weekly
        shell: bash
        run: |
          set -o pipefail
          python scripts/concept.py 2>&1 | tee state/last_concept.log
      - name: Keep media for posting
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media-${{ github.run_id }}
          path: out/
          retention-days: 30
          if-no-files-found: ignore
      - name: Save state
        if: always()
        run: |
          git config user.name "rappit-bot"
          git config user.email "rappit-bot@users.noreply.github.com"
          git add state/
          git diff --cached --quiet && exit 0
          git commit -m "state: concept test"
          for i in 1 2 3; do git push && exit 0; git pull --rebase -q; done
          exit 1
