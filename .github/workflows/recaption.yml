name: Recaption reels
on:
  workflow_dispatch:
    inputs:
      items:
        description: "Item ids, comma separated (e.g. 2026-10-19-reel,2026-10-19-reel2)"
        required: true
permissions:
  contents: write
  actions: read
concurrency:
  group: rappit-state
  cancel-in-progress: false
jobs:
  recaption:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OUT_DIR: ${{ github.workspace }}/out
      ITEMS: ${{ inputs.items }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: (which ffmpeg && fc-list | grep -q DejaVuSans-Bold) || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core)
      - run: pip install -r requirements.txt
      - name: Recaption
        shell: bash
        run: |
          set -o pipefail
          python scripts/recaption.py 2>&1 | tee state/last_recaption.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media-${{ github.run_id }}
          path: out/
          retention-days: 30
          if-no-files-found: ignore
      - name: Save state
        if: always()
        run: |
          git config user.name "rappit-bot"
          git config user.email "rappit-bot@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || (git commit -m "state: recaption" && git push)
