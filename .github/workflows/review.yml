name: Review and post

# Triggered every 5 min by cron-job.org via workflow_dispatch; a quick check skips idle runs.
# GitHub's own scheduler was too unreliable.
on:
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read

concurrency:
  group: rappit-state
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
      OUT_DIR: ${{ github.workspace }}/out
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Anything to do?
        id: quick
        run: python3 scripts/quick_check.py >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.quick.outputs.work == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
        if: steps.quick.outputs.work == 'true'
      - if: steps.quick.outputs.work == 'true'
        run: (which ffmpeg && fc-list | grep -q DejaVuSans-Bold) || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core)
      - name: Run review
        if: steps.quick.outputs.work == 'true'
        shell: bash
        run: |
          set -o pipefail
          python scripts/review.py 2>&1 | tee state/last_review.log
      - name: Post due items
        if: always() && steps.quick.outputs.work == 'true'
        shell: bash
        run: |
          set -o pipefail
          python scripts/post.py 2>&1 | tee state/last_post.log
      - name: Keep redo media for posting
        if: always() && steps.quick.outputs.work == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: media-${{ github.run_id }}
          path: out/
          retention-days: 30
          if-no-files-found: ignore
      - name: Save state
        if: always() && steps.quick.outputs.work == 'true'
        run: |
          git config user.name "rappit-bot"
          git config user.email "rappit-bot@users.noreply.github.com"
          git add state/
          git diff --cached --quiet && exit 0
          git commit -m "state: review"
          for i in 1 2 3; do git push && exit 0; git pull --rebase -q; done
          exit 1
