name: Review and post

on:
  schedule:
    - cron: "*/30 5-20 * * *"   # every 30 min, 08:00-23:59 Beirut
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read

concurrency:
  group: rappit-state
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
      OUT_DIR: ${{ github.workspace }}/out
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Run review
        shell: bash
        run: |
          set -o pipefail
          python scripts/review.py 2>&1 | tee state/last_review.log
      - name: Post due items
        if: always()
        shell: bash
        run: |
          set -o pipefail
          python scripts/post.py 2>&1 | tee state/last_post.log
      - name: Keep redo media for posting
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media-${{ github.run_id }}
          path: out/
          retention-days: 30
          if-no-files-found: ignore
      - name: Save state
        if: always()
        run: |
          git config user.name "rappit-bot"
          git config user.email "rappit-bot@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || (git commit -m "state: review" && git push)
