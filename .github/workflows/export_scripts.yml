name: Export scripts

on:
  workflow_dispatch:
    inputs:
      runs:
        description: "Space-separated run ids whose media to read"
        required: true

permissions:
  contents: write
  actions: read

concurrency:
  group: rappit-state
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q google-genai pyyaml requests
      - name: Download media
        run: for r in ${{ inputs.runs }}; do gh run download "$r" -R "${{ github.repository }}" -D "dl/$r" || true; done
      - run: python scripts/export_scripts.py
      - name: Save
        run: |
          git config user.name "rappit-bot"
          git config user.email "rappit-bot@users.noreply.github.com"
          git add state/
          git diff --cached --quiet && exit 0
          git commit -m "state: export scripts"
          for i in 1 2 3; do git push && exit 0; git pull --rebase -q; done
          exit 1
