name: Weekly drafts

# Triggered Sundays 09:00 Beirut by cron-job.org via workflow_dispatch.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Only these items (comma list: reel,mugshot,soft). Empty = all."
        required: false
        default: ""
      episode:
        description: "Force an episode id from episodes.yaml (optional)"
        required: false
        default: ""
      prefix:
        description: "Item id prefix for test runs (e.g. test-), keeps real drafts untouched"
        required: false
        default: ""

permissions:
  contents: write
  actions: read

concurrency:
  group: rappit-state
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
      OUT_DIR: ${{ github.workspace }}/out
      ONLY: ${{ inputs.only }}
      EPISODE: ${{ inputs.episode }}
      ITEM_PREFIX: ${{ inputs.prefix }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: (which ffmpeg && fc-list | grep -q DejaVuSans-Bold) || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core)
      - run: pip install -r requirements.txt
      - name: Run weekly
        shell: bash
        run: |
          set -o pipefail
          python scripts/weekly.py 2>&1 | tee state/last_weekly.log
      - name: Keep media for posting
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media-${{ github.run_id }}
          path: out/
          retention-days: 30
          if-no-files-found: ignore
      - name: Save state
        if: always()
        run: |
          git config user.name "rappit-bot"
          git config user.email "rappit-bot@users.noreply.github.com"
          git add state/
          git diff --cached --quiet && exit 0
          git commit -m "state: weekly drafts"
          for i in 1 2 3; do git push && exit 0; git pull --rebase -q; done
          exit 1
