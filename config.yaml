# Models (Gemini API). Change here if Google renames a model.
models:
  # Starting points only: if Google retires one, the bot finds the newest available model
  # itself (rappit/models.py) and tells you in Discord.
  text: gemini-3.8-flash                # captions, checks
  text_pro: [gemini-3.1-pro-preview]    # writing
  text_fallbacks: []
  image: gemini-nano-banana-2.1         # frames and reference images
  image_fallback: gemini-3.1-flash-image-preview
  video: gemini-omni-1.1-flash

video:
  resolution: 720p   # Omni: 720p native (1080p/4k are upscaled)
  aspect_ratio: "9:16"
  clip_seconds: 8
  daily_limit: 10    # video requests/day we allow ourselves
  negative_prompt: >-
    bright flat lighting, cartoon, 2D animation, low detail, washed out colors,
    shaky cam, subtitles, text, watermark,
    extra characters, deformed face, extra limbs, smoking, weapons

reel:
  cold_open: false   # flash of the melt before the negotiation
  hook_text: false   # big on-screen hook text in the first seconds
  day_label: false   # small 'DAY n' tag

images:
  size: 2K          # start frames and photos (falls back to default if unsupported)

# Weekly plan (Beirut time), made on Sunday morning. kind "concept" = one fresh ~10 s clip
# (Rappit & Abu Lakma, Lebanese everyday life). Old formats: reel (mafia), mugshot, soft.
plan: []   # one clip at a time for now: made by hand with the "Concept test" workflow
  # - {id: clip1, kind: concept, at: Monday 18:00}

# Safety caps
limits:
  max_redos_per_item: 3

hashtags: "#lilrappit #funnyanimals #comedy #aicomedy"

youtube:
  privacy: public
