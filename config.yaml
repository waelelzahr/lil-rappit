# Models (Gemini API). Change here if Google renames a model.
models:
  text: gemini-flash-latest          # captions and prompt writing
  text_pro: [gemini-pro-latest, gemini-2.5-pro]   # script writing
  text_fallbacks: [gemini-2.5-flash, gemini-3-flash-preview, gemini-2.0-flash]
  image: gemini-nano-banana-2.1       # start frames and photo posts
  image_fallback: gemini-3.1-flash-image-preview
  video: gemini-omni-1.1-flash   # Veo 3.1 preview models were shut down 2026-10-22

video:
  resolution: 720p   # Omni: 720p native (1080p/4k are upscaled)
  aspect_ratio: "9:16"
  clip_seconds: 8
  daily_limit: 10    # video requests/day we allow ourselves
  negative_prompt: >-
    bright flat lighting, cartoon, 2D animation, low detail, washed out colors,
    shaky cam, subtitles, text, watermark,
    extra characters, deformed face, extra limbs, smoking, weapons

reel:
  cold_open: false   # flash of the melt before the negotiation
  hook_text: false   # big on-screen hook text in the first seconds
  day_label: false   # small 'DAY n' tag

images:
  size: 2K          # start frames and photos (falls back to default if unsupported)

# Weekly plan (Beirut time). Each reel gets its own episode; the mugshot
# follows the first reel's episode. `make` delays generation (spreads Veo's
# 10-videos-a-day limit); otherwise items are made on Sunday.
plan:
  - {id: reel, kind: reel, at: Monday 18:00}
  - {id: mugshot, kind: mugshot, at: Wednesday 18:00}
  - {id: reel2, kind: reel, at: Thursday 18:00, make: Wednesday 10:15}
  - {id: soft, kind: soft, at: Saturday 18:00}

# Safety caps
limits:
  max_redos_per_item: 3

hashtags: "#lilrappit #funnyanimals #comedy #aicomedy"

youtube:
  privacy: private   # switch to public once Google approves the API audit
