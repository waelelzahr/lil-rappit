# Episode bank. Each Sunday the pipeline picks a random unused episode and a
# writer model turns it into a 2-shot comedy script:
#   Shot 1 (8 s): tough negotiation, Rappit in control.
#   Shot 2 (8 s): close-up; a bag of carrots slides in; his face melts;
#                 he accepts the terrible deal, said out loud and shown.
# relatable: true = mirrors an everyday situation (picked first; more shareable).
# Fields: setting, opponent, demand (what tough Rappit wants),
#         bad_deal (what he ends up accepting for the carrots).

- id: dealership
  relatable: true
  title: The Dealership
  setting: glossy luxury car showroom, an orange sports car behind a glass desk
  opponent: a smug weasel car salesman in a shiny suit
  demand: the sports car at half price, keys today, slapping a briefcase of cash on the desk
  bad_deal: he pushes the whole briefcase of cash to the weasel and gets no car, just the carrots

- id: interrogation
  title: The Interrogation
  setting: dim police interrogation room, one hanging lamp, metal table
  opponent: a tired bulldog detective with a coffee mug
  demand: to walk out right now, refusing to say a single word
  bad_deal: he signs a full confession to every crime in the city, including ones nobody committed

- id: mafia-meeting
  title: The Sit-Down
  setting: candle-lit back room of an old Italian restaurant, round table, red tablecloth
  opponent: a rival mob boss, an old toad in a pinstripe suit
  demand: the whole east side territory, slamming a map onto the table
  bad_deal: he hands over his entire territory map and his gold chain

- id: salary
  relatable: true
  title: The Negotiation
  setting: glass corporate boardroom, city skyline at dusk
  opponent: a nervous penguin CEO
  demand: one million dollars a month, feet up on the boardroom table
  bad_deal: he signs a contract to work for free for ten years

- id: boxing
  title: The Big Fight
  setting: boxing ring corner between rounds, bright lights, crowd noise
  opponent: a shady fight promoter, a fox with a cigarless grin, leaning through the ropes
  demand: double the prize money or he walks
  bad_deal: he agrees to lose the fight on purpose and lies down on the canvas

- id: landlord
  relatable: true
  title: The Landlord
  setting: small apartment doorway, landlord in the hallway with a clipboard
  opponent: a grumpy goat landlord
  demand: free rent forever, arms crossed, blocking the door
  bad_deal: he pays double rent and hands over his apartment keys

- id: poker
  title: High Stakes
  setting: underground poker table, green felt, single lamp, piles of chips
  opponent: a sly raccoon card shark
  demand: everyone's chips, going all in with a royal flush
  bad_deal: he folds his winning royal flush and pushes all his chips to the raccoon

- id: tax-audit
  relatable: true
  title: The Audit
  setting: drab government tax office, towers of paperwork
  opponent: a strict owl tax auditor with tiny glasses
  demand: zero taxes, ever, tossing the forms in the trash
  bad_deal: he volunteers to pay everyone's taxes in the whole building

- id: court
  title: The Trial
  setting: wooden courtroom, Rappit at the defense table, judge's bench behind
  opponent: a sharp crocodile prosecutor
  demand: case dismissed, smirking at the jury
  bad_deal: he pleads guilty to everything and asks for the longest sentence

- id: protection
  title: The Collection
  setting: cozy bakery counter, display case full of pastries
  opponent: a nervous hedgehog baker
  demand: weekly protection money, leaning over the counter menacingly
  bad_deal: he signs up to work at the bakery for free, putting on an apron

- id: poker-car
  title: Pink Slips
  setting: midnight street race start line, two muscle cars, headlights
  opponent: a cocky racing lizard in a leather jacket
  demand: the lizard's car if he loses the race
  bad_deal: he hands over his own car keys before the race even starts

- id: job-interview
  relatable: true
  title: The Interview
  setting: bright startup office, bean bags, a nervous HR manager across a desk
  opponent: a jittery squirrel HR manager
  demand: to be CEO on day one with a corner office
  bad_deal: he accepts an unpaid internship making coffee for everyone

- id: airport
  relatable: true
  title: Customs
  setting: airport customs desk, x-ray machine, an open suitcase
  opponent: a stern beagle customs officer
  demand: to pass through with his suitcase unopened
  bad_deal: he hands over his passport and volunteers for a full search

- id: chess
  title: Checkmate
  setting: park chess table under autumn trees
  opponent: an ancient tortoise chess master
  demand: the tortoise's lucky golden chess set if he wins
  bad_deal: he knocks over his own king and gives the tortoise his sunglasses

- id: gym
  relatable: true
  title: The Bench
  setting: hardcore gym, heavy barbells, mirrors
  opponent: a huge gorilla bodybuilder
  demand: the gorilla gets off his bench right now
  bad_deal: he becomes the gorilla's personal assistant, carrying his towel and water

- id: car-wash
  relatable: true
  title: The Car Wash
  setting: sunny car wash, Rappit's black muscle car covered in foam
  opponent: a slick otter car wash owner
  demand: a free premium wash for life
  bad_deal: he signs over his muscle car to the car wash

- id: bank
  relatable: true
  title: The Loan
  setting: marble bank office, a manager behind a big wooden desk
  opponent: a pompous pig bank manager
  demand: a ten million dollar loan, no paperwork
  bad_deal: he deposits all his money and his gold chain into the pig's personal account

- id: rival-crew
  title: The Turf War
  setting: empty warehouse, a single table under a hanging light
  opponent: the boss of a rival raccoon gang
  demand: the raccoons leave his block forever
  bad_deal: he hands over his block and joins the raccoon gang as the newest member

- id: parking
  relatable: true
  title: The Parking Spot
  setting: busy city street, one empty parking space between two cars
  opponent: a pushy flamingo driver leaning out of a tiny car
  demand: the parking spot, it's his, nobody else's
  bad_deal: he gives up the spot and agrees to wash the flamingo's tiny car

- id: art-auction
  title: The Auction
  setting: fancy art auction room, a golden carrot sculpture on a pedestal
  opponent: a snooty cat auctioneer
  demand: the golden sculpture for one dollar
  bad_deal: he pays one million dollars for a plain paper bag of carrots
